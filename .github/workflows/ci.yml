name: CI

# Runs only when code changes: docs-only pushes are skipped, and any commit with [skip ci] in its message too.
on:
  push:
    branches: [nightly, stable]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # cargo test runs in package.yml, on Linux and Windows.
  check:
    name: fmt, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  msrv:
    name: builds on Rust 1.88 (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  package:
    uses: ./.github/workflows/package.yml
    with:
      name: ci
