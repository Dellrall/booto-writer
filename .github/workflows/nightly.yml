name: Nightly

# Daily build of the nightly branch into the rolling "nightly-build" pre-release. Skipped when nothing changed.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changed.outputs.build }}
      sha: ${{ steps.changed.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nightly
          fetch-depth: 0
      - name: Skip when nothing changed since the last nightly
        id: changed
        run: |
          last="$(git rev-parse -q --verify 'refs/tags/nightly-build^{commit}' || true)"
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$last" = "$sha" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "nightly-build already points at HEAD; nothing to do."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/package.yml
    with:
      name: nightly
      ref: ${{ needs.changed.outputs.sha }}

  publish:
    needs: [changed, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.changed.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Publish nightly-build pre-release
        run: |
          gh release delete nightly-build --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create nightly-build dist/* --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --target "$SHA" --title "Nightly build" \
            --notes "Built from \`${SHA}\` on $(date -u +%Y-%m-%d). Untested between releases; use a stable release for real cases."
