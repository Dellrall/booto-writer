name: Nightly

# Daily build of the nightly branch into the rolling "nightly-build" pre-release. Skipped when nothing changed.
# The nightly-build tag never moves: the Actions token may not create or move a tag onto a commit that
# changes .github/workflows. Each build replaces the release's files, and its notes name the commit built.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changed.outputs.build }}
      sha: ${{ steps.changed.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nightly
          fetch-depth: 0
      - name: Skip when nothing changed since the last nightly
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(gh release view nightly-build --json body --jq .body 2>/dev/null || true)"
          last="$(grep -oE '[0-9a-f]{40}' <<< "$notes" | head -n1 || true)"
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$last" = "$sha" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "nightly-build already holds a build of HEAD; nothing to do."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/package.yml
    with:
      name: nightly
      ref: ${{ needs.changed.outputs.sha }}

  publish:
    needs: [changed, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.changed.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      # Signed build provenance: gh attestation verify <file> --repo Dellrall/booto-writer
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Publish nightly-build pre-release
        run: |
          notes="Built from \`${SHA}\` on $(date -u +%Y-%m-%d). Untested between releases; use a stable release for real cases. (The nightly-build tag itself stays put; the files are from that commit.)"
          if ! gh release view nightly-build --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # --verify-tag: the token must not create the tag (see the top of this file); push it once by hand.
            gh release create nightly-build --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
              --title "Nightly build" --notes "$notes"
          fi
          gh release upload nightly-build dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit nightly-build --repo "$GITHUB_REPOSITORY" --notes "$notes"
