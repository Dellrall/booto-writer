name: Release

# A v* tag (cut from nightly) becomes a pre-release once every package is built and tested.
# scripts/promote.sh later moves the stable branch to it and marks it Latest, so stable trails
# nightly by however many releases you choose.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match Cargo.toml version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml ${version}"; exit 1; }

  package:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      name: ${{ github.ref_name }}

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Publish pre-release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "$GITHUB_REF_NAME" --generate-notes
