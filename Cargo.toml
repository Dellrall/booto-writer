[package]
name = "booto-writer"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Download and write bootable USB media: Booto setup, or any hybrid ISO / raw image"
license = "GPL-3.0-or-later"
repository = "https://github.com/Dellrall/booto-writer"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.1"

[target.'cfg(unix)'.dependencies]
rpassword = "7.5.4"

[profile.release]
lto = true
strip = true
codegen-units = 1
